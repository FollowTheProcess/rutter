version: "2"
sql:
  - engine: sqlite
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - column: history.duration
            go_type: time.Duration
